<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Technologies</title>
    <style>
        body {
            font-family: Arial;
            margin-bottom: 0%;
            margin-top: 0%;
        }

        .send-button {
            background-color: black;
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
            border: none;
        }

        .chat-input {
            padding: 12px 15px;
            font-size: 16px;
            border-width: 1px;
            border-radius: 10px;
            flex-grow: 1;
        }

        .chat-input-section {
            display: flex;
            margin-bottom: 60px;
        }

        .App-content {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .App-content h1 {
            text-align: center;
            margin: 0%;
        }

        .chat-message-user {
            display: flex;
            justify-content: end;
            align-items: start;
        }

        .chat-message-atlas {
            display: flex;
            align-items: start;
        }

        .message-content {
            border-radius: 10px;
            font-family: Arial;
            background-color: rgb(238, 238, 238);
            margin-left: 10px;
            margin-right: 10px;
            margin-bottom: 20px;
            padding: 15px 20px;
            max-width: 300px;
        }

        .chat-profile-picture {
            width: 50px;
            border-radius: 10px;
        }

        .chat-messages-container {
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            scrollbar-width: none;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages }) {

            const [inputText, setInputText] = React.useState('');

            function saveInput(event) {
                setInputText(event.target.value)
            }

            function sendMessage() {
                const newChatMessages = [
                    ...chatMessages,
                    {
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID()
                    }
                ]

                setChatMessages(newChatMessages)

                const response = Chatbot.getResponse(inputText)
                setChatMessages([
                    ...newChatMessages,
                    {
                        message: response,
                        sender: 'atlas',
                        id: crypto.randomUUID()
                    }
                ])
                setInputText('')
            }

            return (
                <div className='chat-input-section'>
                    <input placeholder='What is that burning thought...' size='35'
                        onChange={saveInput}
                        value={inputText}
                        className='chat-input'
                    />
                    <button
                        onClick={sendMessage}
                        className='send-button'
                    >Send</button>
                </div>
            )
        }

        function ChatMessage({ message, sender }) {
            //const {message,sender} = props;

            /* if (sender === 'atlas') {
                 return (
                     <div>
                         <img src='lynx-8443540.jpg' width='45' />
                         {message}
 
                     </div>
                 )
             } */

            return (
                <div className={sender === 'user' ? 'chat-message-user' : 'chat-message-atlas'}>
                    {sender === 'atlas' && <img src='chatbot.jpg' className='chat-profile-picture' />}
                    <div className='message-content'>
                        {message}
                    </div>
                    {sender === 'user' && <img src="user3.jpg" className='chat-profile-picture' />}
                </div>
            )
        }

        function ChatMessages({ chatMessages }) {
            const chatMessagesRef = React.useRef(null)

            React.useEffect(() => {
                const containerElem = chatMessagesRef.current
                if (containerElem) {
                    containerElem.scrollTop = containerElem.scrollHeight
                }
            }, [chatMessages])
            //const [chatMessages, setChatMessages] = array //Array destructuring (Shortcut)    
            /* const chatMessages = array[0];
             const setChatMessages = array[1]; */

            return (
                <div className='chat-messages-container' ref={chatMessagesRef}>
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        )
                    })}
                </div>
            )

        }

        function App() {

            const [chatMessages, setChatMessages] = React.useState([{
                message: 'hi',
                sender: 'user',
                id: 'id1'
            }, {
                message: 'I takedown relativity equations like bread and butter',
                sender: 'atlas',
                id: 'id2'
            }, {
                message: 'So what is the distance between the moon and earth',
                sender: 'user',
                id: 'id3'
            }, {
                message: 'I estimate around 100,000 km apart',
                sender: 'atlas',
                id: 'id4'
            }])


            return (<div className='App-content'>
                <h1> Atlas Technologies</h1>
                <ChatMessages
                    chatMessages={chatMessages}
                />
                <ChatInput
                    chatMessages={chatMessages}
                    setChatMessages={setChatMessages}
                />
            </div>
            )
        }


        const container = document.querySelector('.js-container')
        ReactDOM.createRoot(container).render(<App />)
    </script>
</body>

</html>
